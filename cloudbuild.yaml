steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/genkit-backend:$COMMIT_SHA',
        '-t',
        '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/genkit-backend:latest',
        './genkit_backend',
      ]

  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/genkit-backend:$COMMIT_SHA',
      ]
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/genkit-backend:latest',
      ]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lean-genkit-backend'
      - '--image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/genkit-backend:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=NODE_ENV=production'

substitutions:
  _AR_REGION: 'us-central1'
  _AR_REPO: 'lean-platform'
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
