<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lean Sovereign Multimodal Platform">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lean AI Portal">
  <title>Lean Sovereign Multimodal Portal</title>
  <link rel="manifest" href="manifest.json">
  <script src="audio_recorder.js" defer></script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
  </script>
</head>
<body style="background-color: #0A0E17; margin: 0; padding: 0; overflow: hidden;">
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.load({
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        }
      }).then(function(engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function(appRunner) {
        return appRunner.runApp();
      });
    });
  </script>
</body>
</html>
