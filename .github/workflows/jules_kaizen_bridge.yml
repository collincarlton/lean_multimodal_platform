name: Sovereign AGY Kaizen Verification Gate (DEC-07 / DEC-08)

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  kaizen-verification-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'agent:agy') ||
      contains(github.event.pull_request.labels.*.name, 'agent:jules') ||
      startsWith(github.head_ref, 'agy/') ||
      startsWith(github.head_ref, 'jules/')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Linters & Verifiers
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ruff pytest

      - name: Fail-Closed Python Bytecode & Lint Check
        run: |
          PY_FILES=$(git ls-files '*.py')
          if [ -n "$PY_FILES" ]; then
            python3 -m py_compile $PY_FILES
          fi
          ruff check . --select E9,F63,F7,F82

      - name: OWASP ASI03 Deterministic Secret Leak Scan (Fail-Closed)
        run: |
          python3 - <<'EOF'
          import re, subprocess, sys
          patterns = [
              ("github_token", re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}\b")),
              ("github_pat", re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b")),
              ("google_api_key", re.compile(r"\bAIzaSy[0-9A-Za-z\-_]{20,}\b")),
              ("llm_api_key", re.compile(r"\bsk-(?:ant-|proj-|live-|test-)?[A-Za-z0-9_\-]{24,}\b")),
              ("aws_key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("private_key", re.compile(r"-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----")),
          ]
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          hits = []
          for f in files:
              try:
                  text = open(f, "r", encoding="utf-8", errors="ignore").read()
              except OSError:
                  continue
              for label, rx in patterns:
                  if rx.search(text):
                      hits.append(f"{f}: {label}")
          if hits:
              print("SECRET SCAN FAILED (OWASP ASI03):")
              for h in hits:
                  print(" -", h)
              sys.exit(1)
          print("Secret scan passed (0 hardcoded credentials detected).")
          EOF

      - name: Enforce LUNORA Architectural Invariants (Fail-Closed)
        run: |
          python3 - <<'EOF'
          import sqlite3, tempfile
          with tempfile.NamedTemporaryFile() as tmp:
              conn = sqlite3.connect(tmp.name)
              conn.execute("PRAGMA journal_mode=WAL;")
              conn.execute("PRAGMA synchronous=NORMAL;")
              conn.execute("PRAGMA cache_size=-32000;")
              assert conn.execute("PRAGMA journal_mode;").fetchone()[0] == "wal"
              assert conn.execute("PRAGMA cache_size;").fetchone()[0] == -32000
          print("Invariant C-03 (SQLite WAL + 32MB cache ceiling) verified.")
          EOF

      - name: Run Repository Unit Tests (Fail-Closed)
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -q
          fi

      - name: DEC-07 Human Merge Gate Notice
        run: |
          echo "All fail-closed checks passed. Auto-approval and auto-merge are intentionally disabled per DEC-07 / OWASP ASI01."
